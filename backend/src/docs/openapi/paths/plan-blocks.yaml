paths:
  /api/plans/{planId}/unahur-blocks:
    get:
      tags:
        - PlanBlocks
      summary: Listar bloques UNAHUR por plan
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bloques UNAHUR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'

    post:
      tags:
        - PlanBlocks
      summary: Crear bloque UNAHUR
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - suggested_year
              properties:
                suggested_year:
                  type: integer
                suggested_term:
                  type: integer
                sort_order:
                  type: integer
      responses:
        '201':
          description: Bloque creado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

