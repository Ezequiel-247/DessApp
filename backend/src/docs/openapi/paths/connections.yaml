paths:
  /api/connections:
    get:
      tags:
        - Connections
      summary: Listar conexiones
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: integer
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de conexiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResponse'

    post:
      tags:
        - Connections
      summary: Crear conexion manual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '201':
          description: Conexion creada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conexion duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connections/{id}:
    get:
      tags:
        - Connections
      summary: Obtener conexion por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conexion encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConnectionData'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Connections
      summary: Actualizar conexion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdateRequest'
      responses:
        '200':
          description: Conexion actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Connections
      summary: Actualizacion parcial de conexion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdateRequest'
      responses:
        '200':
          description: Conexion actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    delete:
      tags:
        - Connections
      summary: Eliminar conexion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conexion eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connections/invite:
    post:
      tags:
        - Connections
      summary: Invitar conexion por email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInviteRequest'
      responses:
        '200':
          description: Invitado no registrado, se notifica al invitador
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '201':
          description: Invitacion enviada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invitacion o conexion existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connections/invitation/{token}:
    get:
      tags:
        - Connections
      summary: Consultar invitacion por token
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitacion encontrada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invitacion inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/connections/invitation/{token}/respond:
    post:
      tags:
        - Connections
      summary: Responder invitacion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponseRequest'
      responses:
        '200':
          description: Invitacion respondida
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Action invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos sobre la invitacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invitacion inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invitacion ya respondida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
