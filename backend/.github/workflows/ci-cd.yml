name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:ci

  deploy:
    name: Deploy to Cloud
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (Dev Branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}" ]; then
            curl -f -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
          else
            echo "RENDER_DEPLOY_HOOK_DEV is not set. Skipping staging deploy."
          fi

      - name: Deploy to Production (Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}