paths:
  /api/activity-records:
    get:
      tags:
        - ActivityRecords
      summary: Listar registros de actividad
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: studentId
          schema:
            type: integer
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityRecordListResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - ActivityRecords
      summary: Crear registro de actividad
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordRequest'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Regla de dominio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/activity-records/{id}:
    get:
      tags:
        - ActivityRecords
      summary: Obtener registro por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActivityRecordData'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - ActivityRecords
      summary: Actualizar registro
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordUpdateRequest'
      responses:
        '200':
          description: Registro actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Regla de dominio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - ActivityRecords
      summary: Actualizacion parcial de registro
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRecordUpdateRequest'
      responses:
        '200':
          description: Registro actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    delete:
      tags:
        - ActivityRecords
      summary: Eliminar registro
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registro eliminado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
