paths:
  /api/students:
    get:
      tags:
        - Students
      summary: Listar estudiantes
      responses:
        '200':
          description: Lista de estudiantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Students
      summary: Crear estudiante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Estudiante creado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Carrera inexistente en enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de unicidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}:
    get:
      tags:
        - Students
      summary: Obtener estudiante por user id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estudiante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentItemResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Students
      summary: Actualizar estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Students
      summary: Actualizacion parcial de estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Estudiante actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Students
      summary: Eliminar estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estudiante eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/profile:
    get:
      tags:
        - Students
      summary: Obtener perfil de estudiante
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Perfil visible segun reglas de privacidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentItemResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil privado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/avatar:
    post:
      tags:
        - Students
      summary: Subir avatar del estudiante
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Id o archivo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No puede actualizar avatar de otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/plan-subjects:
    get:
      tags:
        - Students
      summary: Listar materias del plan del estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: enrollmentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Materias del plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectListResponse'
        '400':
          description: Faltan parametros o enrollment sin plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enrollment no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/academic-summary:
    get:
      tags:
        - Students
      summary: Obtener resumen academico
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resumen academico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/academic-year-breakdown:
    get:
      tags:
        - Students
      summary: Obtener desglose por anio
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: enrollmentId
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Desglose academico por anio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/exam-eligibility:
    get:
      tags:
        - Students
      summary: Obtener elegibilidad a finales
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Elegibilidad a examenes finales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/subject-eligibility:
    get:
      tags:
        - Students
      summary: Obtener elegibilidad a materias
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: enrollmentId
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Elegibilidad de cursada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/activity-eligibility:
    get:
      tags:
        - Students
      summary: Obtener elegibilidad de actividades
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Elegibilidad de actividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'

  /api/students/{id}/pending-finals:
    get:
      tags:
        - Students
      summary: Listar finales pendientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: enrollmentId
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Finales pendientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'

  /api/students/{id}/planner-data:
    get:
      tags:
        - Students
      summary: Obtener datos para planificador
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos de planificacion academica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseGeneric'
        '404':
          description: Estudiante o enrollment activo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/save-plan:
    post:
      tags:
        - Students
      summary: Guardar plan personalizado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlanRequest'
      responses:
        '201':
          description: Plan guardado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Body invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/enrollments:
    get:
      tags:
        - Students
      summary: Listar inscripciones de estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de inscripciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Students
      summary: Agregar inscripcion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Inscripcion creada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante/carrera/plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe inscripcion activa para esa carrera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/students/{id}/enrollments/{enrollmentId}:
    put:
      tags:
        - Students
      summary: Actualizar inscripcion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: enrollmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentUpdateRequest'
      responses:
        '200':
          description: Inscripcion actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante/inscripcion/carrera/plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Students
      summary: Actualizacion parcial de inscripcion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: enrollmentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentUpdateRequest'
      responses:
        '200':
          description: Inscripcion actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Estudiante/inscripcion/carrera/plan no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Students
      summary: Eliminar inscripcion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: enrollmentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inscripcion eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Estudiante o inscripcion no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
