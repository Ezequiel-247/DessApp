paths:
  /api/report-reasons:
    get:
      tags:
        - ReportReasons
      summary: Listar motivos de reporte
      responses:
        '200':
          description: Lista de motivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReasonListResponse'

    post:
      tags:
        - ReportReasons
      summary: Crear motivo de reporte
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportReasonRequest'
      responses:
        '201':
          description: Motivo creado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/report-reasons/{id}:
    get:
      tags:
        - ReportReasons
      summary: Obtener motivo por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Motivo encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReportReasonData'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - ReportReasons
      summary: Actualizar motivo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportReasonUpdateRequest'
      responses:
        '200':
          description: Motivo actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    patch:
      tags:
        - ReportReasons
      summary: Actualizacion parcial de motivo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportReasonUpdateRequest'
      responses:
        '200':
          description: Motivo actualizado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    delete:
      tags:
        - ReportReasons
      summary: Eliminar motivo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Motivo eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
