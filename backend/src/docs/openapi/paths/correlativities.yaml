paths:
  /api/correlativities:
    get:
      tags:
        - Correlativities
      summary: Listar correlatividades
      parameters:
        - in: query
          name: id_plan_subject_target
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista de correlatividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelativityListResponse'

    post:
      tags:
        - Correlativities
      summary: Crear correlatividad
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrelativityRequest'
      responses:
        '201':
          description: Correlatividad creada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Correlatividad duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/correlativities/{id}:
    get:
      tags:
        - Correlativities
      summary: Obtener correlatividad por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Correlatividad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelativityItemResponse'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Correlativities
      summary: Actualizar correlatividad
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrelativityUpdateRequest'
      responses:
        '200':
          description: Correlatividad actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Correlativities
      summary: Actualizacion parcial de correlatividad
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrelativityUpdateRequest'
      responses:
        '200':
          description: Correlatividad actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    delete:
      tags:
        - Correlativities
      summary: Eliminar correlatividad
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Correlatividad eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
