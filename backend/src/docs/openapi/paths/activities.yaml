paths:
  /api/activities:
    get:
      tags:
        - Activities
      summary: Listar actividades
      responses:
        '200':
          description: Lista de actividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'

    post:
      tags:
        - Activities
      summary: Crear actividad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
      responses:
        '201':
          description: Actividad creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActivityData'
        '400':
          description: Name requerido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/activities/{id}:
    get:
      tags:
        - Activities
      summary: Obtener actividad por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Actividad encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActivityData'
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Activities
      summary: Actualizar actividad
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
      responses:
        '200':
          description: Actividad actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ActivityData'

    delete:
      tags:
        - Activities
      summary: Eliminar actividad
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Actividad eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
