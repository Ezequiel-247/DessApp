<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col md:flex-row">
<!-- Left Column: Login Form Canvas -->
<main class="flex-1 flex flex-col justify-center px-lg py-xl md:px-margin md:py-margin bg-surface-container-lowest md:max-w-xl z-10 shadow-xl shadow-primary/5">
<div class="w-full max-w-sm mx-auto">
<!-- Brand Anchor -->
<header class="mb-xl flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">AcademiaPro</h1>
</header>
<!-- Greeting -->
<div class="mb-lg">
<h2 class="font-display-lg text-display-lg text-on-surface mb-base">Bienvenido.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa a tu portal de acompañamiento académico.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">
                        Correo Electrónico
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">
                            mail
                        </span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-sm pl-[44px] pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="email" name="email" placeholder="estudiante@universidad.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">
                        Contraseña
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">
                            lock
                        </span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-DEFAULT py-sm pl-[44px] pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-base">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container font-medium transition-colors" href="#">
                        ¿Olvidé mi contraseña?
                    </a>
</div>
<!-- Submit Button -->
<button class="mt-xs w-full bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container transition-colors rounded-DEFAULT py-sm font-title-sm text-title-sm flex justify-center items-center gap-xs shadow-sm shadow-primary/20" type="submit">
                    Acceder al Portal
                    <span class="material-symbols-outlined text-[20px]">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-lg pt-lg border-t border-surface-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿Nuevo en la plataforma? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Regístrate aquí</a>
</p>
</div>
</div>
</main>
<!-- Right Column: Institutional Atmosphere Image (Hidden on Mobile) -->
<aside class="hidden md:block flex-1 relative bg-surface-variant overflow-hidden">
<!-- Soft background image overlaying brand color -->
<div class="absolute inset-0 bg-primary/80 mix-blend-multiply z-10 pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-tr from-primary via-primary/50 to-transparent z-10 pointer-events-none opacity-90"></div>
<img alt="Estudiantes universitarios" class="absolute inset-0 w-full h-full object-cover grayscale-[20%]" data-alt="soft focus view of modern university campus architecture at dawn with minimal students walking, calm and inspiring scholarly atmosphere, deep teal tint" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqCvLmMVHRtnHRvPjFHBXQEXNdEp0f0xE9Wi4in6IfPubS255muQPGwR1DLGWJa5R5ZNyl2g4ZWT0LQcb4uXhusXC193nku5O2AEkgsHVGjWI4zkSe3sPgQO_H0ANp2an50iAhfyS6pzbNEm1xeYRy57bjIbx6U2OUOwUettWfZiuRCTNyTXRmcGhNOjpAW9HuDPGtRXoy92S1bhoaX-1_Hz4eynv27qYtJr2GOJYuqrDeuvBQzzaqTOTvYZh6HVr0dia3RDJHFHk"/>
<!-- Optional Decorative/Brand Element over Image -->
<div class="relative z-20 h-full p-margin flex flex-col justify-end text-on-primary max-w-lg">
<div class="bg-surface-container-lowest/10 backdrop-blur-md p-lg rounded-xl border border-white/10">
<span class="material-symbols-outlined text-[48px] mb-sm opacity-80" style="font-variation-settings: 'wght' 300;">
                    auto_graph
                </span>
<blockquote class="font-title-sm text-title-sm text-inverse-on-surface leading-relaxed mb-sm">
                    "El éxito académico no es un destino, es un proceso continuo de acompañamiento y dedicación."
                </blockquote>
<p class="font-body-sm text-body-sm text-inverse-on-surface/70 uppercase tracking-widest">
                    Dirección Académica
                </p>
</div>
</div>
</aside>
